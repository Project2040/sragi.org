origin:
  tool: "ChatGPT Image Generation"
  source_prompt: |
    Create a new 16:9 wide-format version of the concept shown in Image A. Image A is the style and content anchor.
    Preserve the core idea: an epic, hopeful regenerative solarpunk landscape at golden hour, with one thoughtful human figure
    in the foreground overlooking a thriving community of gardens, water systems, forest edge, low-impact buildings, people collaborating,
    and a subtle luminous AI intelligence layer woven through the scene as elegant network lines, nodes, and transparent systems overlays.
    Keep the same overall mood, palette, and message of regenerative intelligence—humans, AI, nature, and community working together.
    Recompose the scene for a cinematic horizontal 16:9 frame with more breadth across the valley, wider sky, broader community detail,
    and a balanced panoramic layout. Do not render any text. Avoid dystopia, generic robots, corporate sterility, and classical wind turbines.
  design_intent: "To create the wide hero version of The Regenerative Manifesto: a panoramic visual anchor for SRAGI as regenerative intelligence, where AI reveals relationships across soil, water, people, community and future-capable systems."
