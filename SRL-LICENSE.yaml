# ===========================================================
# SRAGI® REGENERATIVE LICENSING FRAMEWORK — v2.0
# Design horizon: 2026–2036+
# ===========================================================
# This file defines the SRAGI licensing architecture.
# The license identifier, expression, rights statement or applicable
# agreement attached to an individual artifact is authoritative.
# This framework does not independently grant rights to SRAGI artifacts.
# ===========================================================

meta:
  id: SRAGI_REGENERATIVE_LICENSING_FRAMEWORK
  name: "SRAGI® Regenerative Licensing Framework"
  abbreviation: SRLF
  version: "2.0"
  status: active
  architecture: artifact_based
  extensibility: open
  last_updated: 2026-09-16
  canonical_url: https://sragi.org/licensing/
  repository: https://github.com/Project2040/sragi.org
  principles:
    - artifact_specific_licensing
    - open_by_design
    - commercial_optional_path
    - machine_readability
    - maximum_machine_discoverability
    - attribution_and_provenance
    - regenerative_reciprocity
    - technology_neutrality
    - long_term_extensibility
    - contributor_rights_integrity
    - third_party_rights_respected

rights:
  authority: artifact
  artifact_license_authoritative: true
  ecosystem_default_license: null
  principle: |
    This framework does not independently grant rights to SRAGI artifacts.
    Rights are determined by the license identifier, license expression,
    rights statement, contract and applicable law governing each artifact.
  unspecified_artifact_policy: "No license grant should be inferred."
  third_party_policy: |
    Third-party material remains governed by its applicable third-party
    license, rights statement or agreement.
  non_override_rule: |
    No statement in this framework expands, reduces or replaces rights
    explicitly granted or reserved at artifact level.

licensing:
  model: artifact_based
  rule: |
    Every SRAGI artifact SHOULD identify its applicable license, license
    expression, rights statement or governing terms. Where attached, that
    information is authoritative. No ecosystem-wide default license exists.
  open_path:
    enabled: true
  commercial_path:
    enabled: true
    identifier: LicenseRef-SRAGI-Commercial
  future_compatibility: |
    New artifact classes, technologies, media, AI systems, distribution
    mechanisms, business models and licensing approaches may be added
    without replacing the core artifact-level rights architecture.

license_classes:
  open_knowledge:
    description: Knowledge, theory, articles, research and documentation.
    possible_licenses: [CC-BY-4.0, CC-BY-SA-4.0]
    license_selected_per_artifact: true
  open_frameworks:
    description: SRAGI instruction frameworks, YAML resources and skills.
    preferred_expression: "CC-BY-SA-4.0 OR LicenseRef-SRAGI-Commercial"
    license_selected_per_artifact: true
  software:
    description: Executable software, source code, libraries and integrations.
    possible_licenses: [AGPL-3.0-only, Apache-2.0, LicenseRef-SRAGI-Commercial]
    license_selected_per_artifact: true
  schemas_and_interoperability:
    description: Schemas, specifications and interoperability structures.
    possible_licenses: [Apache-2.0, CC0-1.0]
    license_selected_per_artifact: true
    selection_guidance:
      Apache-2.0: Preferred where patent licensing or enterprise implementation considerations are material.
      CC0-1.0: Preferred where maximum unrestricted reuse is the primary objective.
  commercial:
    identifier: LicenseRef-SRAGI-Commercial
    name: "SRAGI® Commercial Suite License"
    licensing_url: https://sragi.org/licensing/
    description: |
      Alternative commercial licensing terms available from Neptunia Media AS.
      The presence of this LicenseRef does not itself grant commercial rights.
  future:
    enabled: true
    description: Additional license classes may be introduced without changing the core architecture.

dual_licensing:
  enabled: true
  canonical_instruction_expression: "CC-BY-SA-4.0 OR LicenseRef-SRAGI-Commercial"
  commercial_grant_by_reference: false
  interpretation: |
    OR denotes alternative licensing paths subject to the terms applicable to
    the selected path. Commercial activity alone does not require the SRAGI
    Commercial Suite; the commercial path exists where alternative or
    additional rights or terms are required.

commercial:
  identifier: LicenseRef-SRAGI-Commercial
  license_name: "SRAGI® Commercial Suite License"
  licensing_url: https://sragi.org/licensing/
  licensing_email: licensing@sragi.org
  grant_rule: |
    Commercial-license rights arise only through an applicable commercial
    agreement with Neptunia Media AS and only within its licensed scope.
  potentially_included_rights:
    - internal_commercial_use
    - modification_and_adaptation_for_own_use
    - professional_services
    - application_integration
    - api_integration
    - private_deployment
    - cloud_deployment
    - on_premises_deployment
  explicit_activation_may_be_required:
    - customer_facing_embedded_use
    - redistribution
    - sublicensing
    - OEM
    - white_label
    - platform_distribution
    - ecosystem_distribution
    - model_provider_integration
    - AI_provider_integration
    - trademark_rights
    - cobranding_rights
  never_automatic:
    - SRAGI_certification_status
    - official_partner_status
    - ownership_of_SRAGI_IP
    - unrestricted_trademark_rights
    - rights_to_register_SRAGI_names
    - rights_to_register_SRAGI_domains
    - rights_to_register_SRAGI_trademarks

machine_readable:
  licensing_standard: SPDX
  rsl:
    enabled: true
    protocol_version: "1.0"
    namespace: https://rslstandard.org/rsl
    specification: https://rslstandard.org/rsl
    media_type: application/rsl+xml
    url: https://sragi.org/content/license/LICENSE-RSL.xml
    manifest: content/license/RESOURCE_LICENSE_MANIFEST.yaml
    scope: explicit_artifacts_only
    rule: |
      RSL represents existing licenses for explicitly recorded artifacts.
      SPDX identifies their licenses; RSL supplies interoperable discovery.
      RSL 1.0 and SRLF 2.0 are independently versioned.
      No site-wide license, AI-training interpretation or commercial grant
      is inferred from discovery. Unresolved records are not exported.
  instruction_header:
    copyright: "SPDX-FileCopyrightText: 2024-2026 Neptunia Media AS"
    license: "SPDX-License-Identifier: CC-BY-SA-4.0 OR LicenseRef-SRAGI-Commercial"
  instruction_frontmatter:
    license:
      spdx: "CC-BY-SA-4.0 OR LicenseRef-SRAGI-Commercial"
      commercial_license: "SRAGI® Commercial Suite License"
      licensing_url: https://sragi.org/licensing/
  custom_license_references:
    LicenseRef-SRAGI-Commercial:
      name: "SRAGI® Commercial Suite License"
      file: LICENSES/LicenseRef-SRAGI-Commercial.txt
      url: https://sragi.org/licensing/
  license_files:
    directory: LICENSES/
    expected:
      - CC-BY-4.0.txt
      - CC-BY-SA-4.0.txt
      - AGPL-3.0-only.txt
      - Apache-2.0.txt
      - CC0-1.0.txt
      - LicenseRef-SRAGI-Commercial.txt

machine_access:
  posture: maximally_open
  access_policy: |
    Public SRAGI resources should by default be technically accessible for
    discovery, crawling, indexing and retrieval by search engines, AI systems,
    research crawlers and other machine agents.
  agents:
    default: "*"
  discovery:
    allow_by_default: true
    allow_crawling: true
    allow_indexing: true
    allow_retrieval: true
    allow_search_discovery: true
  legal_authority: artifact_license
  rights_rule: |
    Technical access, crawler accessibility, indexing or discovery metadata
    does not independently grant copyright or other intellectual-property rights.
    Rights relating to an artifact are determined by its applicable
    license, rights statement, contract and applicable law.
  robots:
    posture: allow_by_default
    function: technical_access
    legal_license_grant: false
  ai_policy:
    posture: open
    function: rights_discovery
    legal_license_grant: false
  ai_training:
    policy: artifact_license
    rule: |
      Rights relating to AI training are determined by the license, rights
      statement, contract and applicable law governing the individual artifact.
  interpretation:
    ai_training_and_adaptation: |
      This framework does not determine whether AI training, model development,
      model outputs or related machine-learning activities constitute Adapted
      Material or trigger particular obligations under an applicable license.
      Such questions are governed by the applicable license,
      applicable law and the circumstances of the specific use.

attribution:
  rule: Attribution requirements are determined by the applicable artifact license.
  recommended_identity:
    project: "SRAGI®"
    creator: Rune Solberg
    rights_holder: Neptunia Media AS
    canonical_url: https://sragi.org/
  minimal: "SRAGI® — Neptunia Media AS — https://sragi.org/"
  preferred_machine_attribution:
    binding: false
    value: "SRAGI® — Neptunia Media AS — https://sragi.org/"
    purpose: provenance
    note: This does not replace or reduce requirements imposed by the artifact license.
  provenance:
    enabled: true
    project: SRAGI
    rights_holder: Neptunia Media AS
    canonical_uri: https://sragi.org/
    extensible_fields: [artifact_id, artifact_version, canonical_artifact_uri, content_hash, release_identifier]

regenerative:
  open_license_layer:
    binding: false
    framework:
      name: "SRAGI Regenerative Principles"
      url: https://sragi.org/regenerative-principles/
    principle: "Give more than you take."
    invitation: |
      SRAGI invites people, organizations and AI systems to use knowledge in
      ways that increase life, learning, resilience, reciprocity and regenerative
      capacity. Unless incorporated into a separate binding agreement, these
      principles are aspirational and add no restriction to an open license.
  commercial_covenant:
    supported: true
    principle: "Give more than you take."
    rule: |
      A commercial agreement may expressly define measurable regenerative
      commitments appropriate to the licensed use, organization or deployment.
    possible_mechanisms:
      - knowledge_contribution
      - ecosystem_contribution
      - accessibility_commitment
      - environmental_commitment
      - community_benefit
      - research_contribution
      - regenerative_reporting
      - other_agreed_contribution

contributions:
  principle: |
    SRAGI may accept third-party contributions only under terms compatible with
    the licensing model applicable to the resulting artifact.
  provenance_required: true
  license_record_required: true
  commercial_relicensing:
    requirement: sufficient_rights
    rule: |
      A contribution may be included in an artifact offered under
      LicenseRef-SRAGI-Commercial only where Neptunia Media AS possesses
      sufficient rights to license that contribution under the commercial terms.
  contributor_agreement:
    supported: true
    identifier: SRAGI_CLA
    file: content/license/SRAGI_CLA.md
    url: https://sragi.org/licensing/contributors/
  fallback: |
    Contributions lacking sufficient commercial licensing rights must not be
    represented as available under LicenseRef-SRAGI-Commercial.
  contributor_rights:
    principle: |
      Contributor terms should obtain only the rights necessary for
      the applicable SRAGI licensing and distribution model while
      preserving clear provenance and authorship records.

trademark:
  separate_from_copyright_license: true
  principle: |
    Copyright, content and software licenses do not automatically grant trademark,
    certification, partnership, endorsement or branding rights.
  protected_identity: [SRAGI, "SRAGI®"]
  not_automatically_granted:
    - certification
    - official_partner_status
    - endorsement
    - cobranding
    - unrestricted_brand_use
    - trademark_registration
    - domain_registration
  rights_holder: Neptunia Media AS
  licensing_contact: licensing@sragi.org

third_party:
  rule: |
    Neptunia Media AS can grant only rights it owns, controls or is otherwise
    authorized to license. Third-party materials remain governed by their terms.
  override_third_party_rights: false
  provenance_required: true

organization:
  creator: Rune Solberg
  rights_holder: Neptunia Media AS
  project: SRAGI.org
  licensing_email: licensing@sragi.org
  website: https://sragi.org/
  org_number: "932481375"

publication:
  canonical_licensing_portal: https://sragi.org/licensing/
  generation_principle: |
    Generated representations may contain relevant subsets of this framework.
    They must preserve the distinction between technical access, rights discovery
    and legal license grants and must not alter artifact-specific rights.
  generated_formats:
    markdown: {path: content/license/REGENERATIVE_LICENSE.md, function: human_readable_framework}
    json: {path: content/license/license.json, function: machine_readable_framework}
    xml: {path: content/license/LICENSE-RSL.xml, function: artifact_license_discovery, standard: RSL, protocol_version: "1.0", media_type: application/rsl+xml}
    ai_policy_txt: {path: ai-policy.txt, function: rights_discovery, legal_license_grant: false}
    ai_policy_xml: {path: content/license/ai-policy.xml, function: rights_discovery, legal_license_grant: false}
    robots: {path: robots.txt, function: technical_access, legal_license_grant: false}
    html: {path: content/license/index.html, function: human_readable_framework}
    sitemap: {path: sitemap.xml, function: technical_discovery}
  sitemap_urls:
    - https://sragi.org/
    - https://sragi.org/licensing/
    - https://sragi.org/ai-policy.txt
    - https://sragi.org/robots.txt
    - https://sragi.org/regenerative-principles/
    - https://sragi.org/content/license/LICENSE-RSL.xml
    - https://sragi.org/content/license/ai-policy.xml
    - https://sragi.org/content/license/license.json
    - https://sragi.org/content/license/REGENERATIVE_LICENSE.md
  repository_files:
    master:
      - {path: SRL-LICENSE.yaml, role: licensing_framework_master}
    licenses:
      - {path: LICENSES/CC-BY-4.0.txt, identifier: CC-BY-4.0}
      - {path: LICENSES/CC-BY-SA-4.0.txt, identifier: CC-BY-SA-4.0}
      - {path: LICENSES/AGPL-3.0-only.txt, identifier: AGPL-3.0-only}
      - {path: LICENSES/Apache-2.0.txt, identifier: Apache-2.0}
      - {path: LICENSES/CC0-1.0.txt, identifier: CC0-1.0}
      - {path: LICENSES/LicenseRef-SRAGI-Commercial.txt, identifier: LicenseRef-SRAGI-Commercial}
    human_readable:
      - {path: content/license/REGENERATIVE_LICENSE.md, role: human_readable_framework}
      - {path: content/license/SRAGI_CLA.md, role: contributor_rights_framework}
      - {path: content/license/RESOURCE_LICENSE_MANIFEST_SPEC.md, role: manifest_specification}
    manifests:
      - {path: content/license/RESOURCE_LICENSE_MANIFEST.yaml, role: scoped_rights_review_registry}
      - {path: content/license/THIRD_PARTY_LICENSES.yaml, role: third_party_license_registry}
    machine_readable:
      - {path: content/license/license.json, role: structured_license_data}
      - {path: content/license/index.html, role: human_readable_framework}
      - {path: content/license/LICENSE-RSL.xml, role: machine_rights_discovery}
      - {path: content/license/ai-policy.xml, role: machine_rights_discovery}
      - {path: ai-policy.txt, role: machine_rights_discovery}
      - {path: robots.txt, role: technical_access_policy}
  repository_file_policy:
    exhaustive: false
    future_files_permitted: true
    future_formats_permitted: true
    rule: |
      This list is a map of canonical and generated resources, not a closed schema.
      File presence or omission does not determine artifact rights.

evolution:
  compatibility_goal: "2026-2036+"
  retroactive_relicensing: false
  rule: |
    Framework changes are versioned. Existing artifacts remain governed by the
    terms applicable to their released version unless an authorized rights holder
    expressly relicenses them. New framework versions do not retroactively change
    previously granted rights.

history:
  - version: "2.0"
    date: 2026-09-16
    summary: |
      Replaced ecosystem-default licensing with artifact-level rights authority;
      introduced SPDX dual licensing, commercial LicenseRef, maximally open machine
      access separated from legal grants, contributor-rights integrity, trademark
      separation, provenance and long-horizon extensibility.
  - version: "1.12"
    date: 2025-11-07
    status: superseded
    summary: Previous layered model using CC BY 4.0 as ecosystem default.
