# ===========================================================
# SRAGI CONTENT SPEC (GENERIC TEMPLATE v1.0)
# Operationalized for Neptunia Mission Control v5.x
# ===========================================================

id: "{{ input.SLUG }}"
uuid: "{{ input.UUID }}"
type: "article"
status: "ready_for_loom"
version: "1.0.0"
created_at: "{{ input.DATE }}"

# -----------------------------------------------------------
# 1. TITLES (Multilingual)
# -----------------------------------------------------------
title:
  en: "{{ input.TITLE_EN }}"
  nb: "{{ input.TITLE_NB }}"

subtitle:
  en: "" # Fylles ut manuelt senere
  nb: ""

language_primary: "en"
translations:
  available: ["en", "nb"]
  slugs: 
    en: "{{ input.SLUG }}"
    nb: "{{ input.SLUG }}"

# -----------------------------------------------------------
# 2. SEO METADATA
# -----------------------------------------------------------
seo:
  title:
    en: "{{ input.SEO_TITLE_EN }}"
    nb: "{{ input.SEO_TITLE_NB }}"
  description:
    en: "{{ input.META_DESC }}"
    nb: "{{ input.META_DESC }}"
  canonical: "{{ organization.website }}{{ input.SLUG }}"
  keywords:
    en: [] # Loom kan fylle disse senere
    nb: []
  og_image: "{{ input.SLUG }}-social.jpg"
  twitter_card: "summary_large_image"

# -----------------------------------------------------------
# 3. INFORMATION ARCHITECTURE (IA)
# -----------------------------------------------------------
ia:
  category: "blog" # Standard, kan endres
  parent_page: ""
  weight: 0

# -----------------------------------------------------------
# 4. TAXONOMY ATTACHMENTS (Dynamic)
# -----------------------------------------------------------
taxonomy:
  pillar: ["{{ input.PILLAR }}"]
  domain: ["{{ input.DOMAIN }}"]
  context: ["{{ input.CONTEXT }}"]
  phase: ["{{ input.PHASE }}"]
  scale: ["{{ input.SCALE }}"]
  mode: ["{{ input.MODE }}"]
  actor_type: []
  actor_role: []
  relations: []

# -----------------------------------------------------------
# 5. MEDIA DEFINITIONS
# -----------------------------------------------------------
media:
  hero:
    file: "{{ input.SLUG }}-hero.jpg"
    ratio: "16:9"
    role: "hero"
    alt:
      en: "Hero image for {{ input.TITLE_EN }}"
      nb: "Hovedbilde for {{ input.TITLE_NB }}"

  card:
    file: "{{ input.SLUG }}-card.jpg"
    ratio: "4:3"
    role: "card"
    alt:
      en: "Card image for {{ input.TITLE_EN }}"
      nb: "Kortbilde for {{ input.TITLE_NB }}"

  social:
    file: "{{ input.SLUG }}-social.jpg"
    ratio: "1.91:1"
    role: "social"
    alt:
      en: "Social share image"
      nb: "Delingsbilde"

  gallery: []

# -----------------------------------------------------------
# 6. ASSOCIATED CONTENT FILES
# -----------------------------------------------------------
content:
  en: "{{ input.SLUG }}.en.md"
  nb: "{{ input.SLUG }}.nb.md"
  summary:
    en: "{{ input.META_DESC }}"
    nb: "{{ input.META_DESC }}"

# -----------------------------------------------------------
# 7. KNOWLEDGE GRAPH LINKS
# -----------------------------------------------------------
graph:
  related: []
  child_of: []
  part_of: ["sragi-os"]
  inspired_by: []
  supports: []

# -----------------------------------------------------------
# 8. AUTHORS & CONTRIBUTORS
# -----------------------------------------------------------
authors:
  primary: "{{ input.author_id }}"
  contributors: ["neptunia-mission-control"]

reviewed_by: []

# -----------------------------------------------------------
# 9. PUBLICATION METADATA
# -----------------------------------------------------------
publication:
  created_at: "{{ input.DATE }}"
  updated_at: "{{ input.DATE }}"
  published_at: ""
  revision_history: 
    - version: "1.0.0"
      date: "{{ input.DATE }}"
      action: "Initial generation via Mission Control"

# -----------------------------------------------------------
# 10. LOOM VALIDATION STATUS
# -----------------------------------------------------------
loom:
  validated: false
  errors: []
  warnings: []
  strict_mode: true

# -----------------------------------------------------------
# 11. LICENSE
# -----------------------------------------------------------
license:
  policy_ref: website_content
  spdx: null
  rights_statement: null
  status: unresolved
  framework_url: "{{ publication.canonical_licensing_portal }}"
