name: Build SRAGI Licenses

on:
  push:
    branches: [main, dev, sragi-licensing-2.0-migration]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate SRLF generated artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r automation/license_builder/requirements.txt
      - name: Validate master, license texts, RSL evidence and generated output
        run: python automation/license_builder/build_licenses.py --check
      - name: Test RSL conformance profile, licensing boundaries and regressions
        run: python -m unittest discover -s tests -v
