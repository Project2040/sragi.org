name: Build SRAGI Licenses

on:
  push:
    branches: [main, dev, sragi-licensing-2.0-migration]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Validate SRLF generated artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r automation/license_builder/requirements.txt
      - name: Rebuild validated SRLF outputs
        run: python automation/license_builder/build_licenses.py
      - name: Commit regenerated outputs on migration branch
        if: github.event_name == 'push' && github.ref_name == 'sragi-licensing-2.0-migration'
        run: |
          if git diff --quiet; then
            echo "Generated outputs already current."
            exit 0
          fi
          git config user.name "SRAGI License Builder"
          git config user.email "licensing@sragi.org"
          git add content/license/LICENSE-RSL.xml content/license/REGENERATIVE_LICENSE.md content/license/index.html content/license/license.json content/license/ai-policy.xml content/license/WEBSITE-LICENSE.html ai-policy.txt robots.txt sitemap.xml
          git commit -m "Regenerate SRLF 2.0 licensing outputs"
          git push origin HEAD:sragi-licensing-2.0-migration
      - name: Test RSL conformance profile, licensing boundaries and regressions
        run: python -m unittest discover -s tests -v
