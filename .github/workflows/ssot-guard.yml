name: 🧭 SRAGI SSOT Guard
# SPDX-License-Identifier: CC-BY-4.0
# Artifact-level licensing integrity; no repository-wide license assignment.

on:
  push:
    branches: [main, dev, "ssot/*", sragi-licensing-2.0-migration]
  pull_request:
    branches: [main, dev, "ssot/*"]

permissions:
  contents: read

jobs:
  ssot-verify:
    name: 🔍 Enforce SRL SSOT Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Reject obsolete blanket license claims
        run: python tools/enforce_version_refs.py
